<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BOMBAE SQUARE — The Map</title>

<!-- FONTS -->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link
  href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;700&display=swap"
  rel="stylesheet"
>

<!-- LEAFLET -->

<link
  rel="stylesheet"
  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<style>

/* =====================================================
   BOMBAE SQUARE COLOURS
===================================================== */

:root{
  --black:#0A0908;
  --gold:#C89B5A;
  --gold-bright:#F0C878;
  --gold-deep:#8B6F3F;
  --gold-pale:#E8D3A0;
  --cream:#F4EDE4;
  --cream-dim:rgba(244,237,228,.55);
}

/* =====================================================
   RESET
===================================================== */

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  padding:0;
  background:var(--black);
  color:var(--cream);
  font-family:'DM Sans',sans-serif;
}

body{
  min-height:100vh;
}

/* =====================================================
   MOBILE FRAME
===================================================== */

.frame{
  max-width:430px;
  margin:0 auto;
  min-height:100vh;
  position:relative;
  overflow:hidden;
  background:var(--black);
}

/* =====================================================
   GRAIN
===================================================== */

.grain{
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:5000;
  opacity:.035;
  background-image:url(
    "data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E"
  );
}

/* =====================================================
   CONFETTI
===================================================== */

.gconfetti{
  position:absolute;
  z-index:5;
  pointer-events:none;
  animation:float 5s ease-in-out infinite;
}

.diamond{
  width:9px;
  height:9px;
  background:var(--gold-bright);
  transform:rotate(45deg);
}

.triangle{
  width:0;
  height:0;
  border-left:6px solid transparent;
  border-right:6px solid transparent;
  border-bottom:11px solid var(--gold-deep);
}

.tiny-dot{
  width:6px;
  height:6px;
  border-radius:50%;
  background:var(--gold-pale);
  opacity:.5;
}

@keyframes float{
  0%,100%{
    transform:translateY(0) rotate(var(--r,10deg));
  }

  50%{
    transform:translateY(-6px)
              rotate(calc(var(--r,10deg) + 6deg));
  }
}

/* =====================================================
   HEADER
===================================================== */

.header{
  position:relative;
  padding:28px 22px 20px;
  border-bottom:1px solid rgba(200,155,90,.18);
}

.back{
  display:inline-flex;
  align-items:center;
  gap:7px;
  color:var(--cream-dim);
  text-decoration:none;
  font-size:11px;
  font-weight:700;
  letter-spacing:1.2px;
  text-transform:uppercase;
  margin-bottom:25px;
}

.back span{
  color:var(--gold-bright);
  font-size:18px;
}

.eyebrow{
  font-family:'Bebas Neue',sans-serif;
  color:var(--gold-bright);
  font-size:13px;
  letter-spacing:3px;
  margin-bottom:7px;
}

.header h1{
  font-family:'Bebas Neue',sans-serif;
  font-size:64px;
  line-height:.82;
  letter-spacing:1px;
  margin:0;
}

.intro{
  color:var(--cream-dim);
  font-size:13px;
  line-height:1.55;
  max-width:350px;
  margin:16px 0 0;
}

/* =====================================================
   CATEGORY FILTERS
===================================================== */

.filters{
  display:flex;
  gap:8px;
  overflow-x:auto;
  padding:16px 18px;
  scrollbar-width:none;
}

.filters::-webkit-scrollbar{
  display:none;
}

.filter{
  flex:0 0 auto;
  border:1px solid rgba(200,155,90,.35);
  color:var(--cream-dim);
  background:transparent;
  border-radius:20px;
  padding:8px 13px;
  font-family:'DM Sans',sans-serif;
  font-size:10px;
  font-weight:700;
  letter-spacing:.8px;
  cursor:pointer;
}

.filter.active{
  background:var(--gold-bright);
  color:var(--black);
  border-color:var(--gold-bright);
}

/* =====================================================
   MAP
===================================================== */

.map-shell{
  position:relative;
  margin:3px 14px 25px;
  border-radius:10px;
  overflow:hidden;
  border:1px solid rgba(200,155,90,.45);
  box-shadow:0 18px 40px rgba(0,0,0,.6);
}

#map{
  width:100%;
  height:560px;
  background:#E8D9B7;
}

/* LIGHT GOLD MAP */

.leaflet-tile{
  filter:
    sepia(.30)
    saturate(.62)
    brightness(1.16)
    contrast(.88);
}

.leaflet-container{
  background:#E8D9B7;
}

/* =====================================================
   MAP CONTROLS
===================================================== */

.leaflet-control-zoom{
  border:none !important;
}

.leaflet-control-zoom a{
  background:var(--black) !important;
  color:var(--gold-bright) !important;
  border-color:rgba(200,155,90,.3) !important;
}

.leaflet-control-attribution{
  background:rgba(244,237,228,.82) !important;
  color:rgba(10,9,8,.65) !important;
  font-size:8px !important;
}

.leaflet-control-attribution a{
  color:var(--gold-deep) !important;
}

/* =====================================================
   GOLD MARKERS
===================================================== */

.gold-marker{
  position:relative;
  width:30px;
  height:30px;
}

.gold-marker::before{
  content:'';
  position:absolute;
  width:19px;
  height:19px;
  left:5px;
  top:3px;
  background:var(--gold-bright);
  border:2px solid var(--black);
  box-shadow:
    0 0 0 2px var(--gold),
    0 0 15px rgba(240,200,120,.9);
  transform:rotate(45deg);
}

.gold-marker::after{
  content:'';
  position:absolute;
  width:6px;
  height:6px;
  left:11.5px;
  top:9.5px;
  border-radius:50%;
  background:var(--black);
  z-index:2;
}

/* =====================================================
   LOCATION PANEL
===================================================== */

.location-panel{
  position:fixed;
  left:50%;
  bottom:0;
  width:min(430px,100%);
  min-height:190px;
  transform:translate(-50%,110%);
  background:var(--black);
  border-top:1px solid rgba(240,200,120,.45);
  box-shadow:0 -15px 45px rgba(0,0,0,.75);
  z-index:2500;
  display:flex;
  padding:14px;
  gap:14px;
  transition:
    transform .4s cubic-bezier(.22,.8,.25,1);
}

.location-panel.show{
  transform:translate(-50%,0);
}

/* =====================================================
   PANEL IMAGE
===================================================== */

.panel-image{
  position:relative;
  width:125px;
  min-width:125px;
  height:160px;
  overflow:hidden;
  border-radius:7px;
  background:#181411;
}

.panel-image img{
  width:100%;
  height:100%;
  object-fit:cover;
  filter:
    grayscale(1)
    sepia(.35)
    contrast(1.08)
    brightness(.55);
}

.panel-image-tone{
  position:absolute;
  inset:0;
  mix-blend-mode:color;
  background:
    linear-gradient(
      155deg,
      var(--gold-deep),
      #0A0908 85%
    );
  opacity:.6;
  pointer-events:none;
}

.panel-image::after{
  content:'';
  position:absolute;
  inset:0;
  background:
    linear-gradient(
      180deg,
      transparent 35%,
      rgba(10,9,8,.8) 100%
    );
}

/* =====================================================
   PANEL TEXT
===================================================== */

.panel-info{
  flex:1;
  padding:3px 24px 5px 0;
  min-width:0;
}

.panel-number{
  font-family:'Bebas Neue',sans-serif;
  color:var(--gold-bright);
  font-size:12px;
  letter-spacing:2px;
  margin-bottom:3px;
}

.panel-category{
  color:var(--gold-bright);
  font-size:8px;
  font-weight:700;
  letter-spacing:1.4px;
  margin-bottom:8px;
}

.panel-info h2{
  font-family:'Bebas Neue',sans-serif;
  color:var(--cream);
  font-size:30px;
  line-height:.88;
  letter-spacing:.5px;
  margin:0 0 9px;
}

.panel-info p{
  color:var(--cream-dim);
  font-size:10.5px;
  line-height:1.45;
  margin:0;
}

/* =====================================================
   READ MORE BUTTON
===================================================== */

.read-more{
  margin-top:12px;
  border:none;
  background:var(--gold-bright);
  color:var(--black);
  padding:8px 13px;
  border-radius:20px;
  font-family:'DM Sans',sans-serif;
  font-size:9px;
  font-weight:700;
  letter-spacing:1px;
  cursor:pointer;
  transition:transform .2s ease;
}

.read-more:active{
  transform:scale(.95);
}

/* =====================================================
   CLOSE
===================================================== */

.panel-close{
  position:absolute;
  top:8px;
  right:10px;
  width:25px;
  height:25px;
  border:0;
  border-radius:50%;
  background:rgba(10,9,8,.85);
  color:var(--gold-pale);
  font-size:20px;
  line-height:20px;
  cursor:pointer;
  z-index:5;
}

/* =====================================================
   FULL DETAIL PANEL
===================================================== */

.details-panel{
  position:fixed;
  left:50%;
  bottom:0;
  width:min(430px,100%);
  height:min(88vh,760px);
  transform:translate(-50%,110%);
  background:var(--black);
  border-top:1px solid rgba(240,200,120,.5);
  box-shadow:0 -20px 60px rgba(0,0,0,.85);
  z-index:2700;
  overflow-y:auto;
  transition:
    transform .4s cubic-bezier(.22,.8,.25,1);
}

.details-panel.show{
  transform:translate(-50%,0);
}

.details-image{
  width:100%;
  height:230px;
  position:relative;
  overflow:hidden;
}

.details-image img{
  width:100%;
  height:100%;
  object-fit:cover;
  filter:
    grayscale(.35)
    sepia(.2)
    contrast(1.05)
    brightness(.65);
}

.details-image::after{
  content:'';
  position:absolute;
  inset:0;
  background:
    linear-gradient(
      180deg,
      transparent 35%,
      var(--black) 100%
    );
}

.details-close{
  position:absolute;
  top:12px;
  right:14px;
  width:34px;
  height:34px;
  border-radius:50%;
  border:1px solid rgba(240,200,120,.45);
  background:rgba(10,9,8,.8);
  color:var(--gold-pale);
  font-size:22px;
  cursor:pointer;
  z-index:5;
}

.details-content{
  padding:0 20px 35px;
  margin-top:-25px;
  position:relative;
  z-index:2;
}

.details-number{
  font-family:'Bebas Neue',sans-serif;
  color:var(--gold-bright);
  font-size:12px;
  letter-spacing:2px;
}

.details-category{
  color:var(--gold-bright);
  font-size:9px;
  font-weight:700;
  letter-spacing:1.5px;
  margin-top:3px;
}

.details-title{
  font-family:'Bebas Neue',sans-serif;
  font-size:42px;
  line-height:.9;
  margin:7px 0 12px;
}

.details-description{
  color:var(--cream-dim);
  font-size:12px;
  line-height:1.6;
  margin-bottom:24px;
}

/* =====================================================
   DETAIL SECTIONS
===================================================== */

.detail-section{
  margin-top:22px;
  padding-top:16px;
  border-top:1px solid rgba(200,155,90,.18);
}

.detail-heading{
  font-family:'Bebas Neue',sans-serif;
  color:var(--gold-bright);
  font-size:18px;
  letter-spacing:1px;
  margin-bottom:10px;
}

.detail-section p{
  color:var(--cream-dim);
  font-size:11px;
  line-height:1.6;
  margin:0;
}

.detail-list{
  list-style:none;
  padding:0;
  margin:0;
}

.detail-list li{
  position:relative;
  color:var(--cream-dim);
  font-size:11px;
  line-height:1.55;
  padding:7px 0 7px 17px;
  border-bottom:1px solid rgba(244,237,228,.06);
}

.detail-list li::before{
  content:'✦';
  position:absolute;
  left:0;
  top:8px;
  color:var(--gold-bright);
  font-size:8px;
}

.practical-item{
  display:flex;
  gap:10px;
  padding:8px 0;
  border-bottom:1px solid rgba(244,237,228,.06);
}

.practical-label{
  flex:0 0 105px;
  color:var(--gold);
  font-size:9px;
  font-weight:700;
  text-transform:uppercase;
  letter-spacing:.7px;
}

.practical-value{
  flex:1;
  color:var(--cream-dim);
  font-size:10px;
  line-height:1.45;
}

/* =====================================================
   FLOATING BUTTONS
===================================================== */

.floating-controls{
  position:fixed;
  left:50%;
  bottom:18px;
  transform:translateX(-50%);
  width:min(430px,100%);
  padding:0 18px;
  display:flex;
  gap:10px;
  z-index:1800;
  pointer-events:none;
}

.float-btn{
  pointer-events:auto;
  border:none;
  cursor:pointer;
  height:52px;
  border-radius:30px;
  font-family:'DM Sans',sans-serif;
  font-size:11px;
  font-weight:700;
  letter-spacing:1px;
  transition:
    transform .2s ease,
    box-shadow .2s ease;
}

.float-btn:active{
  transform:scale(.96);
}

.explore-btn{
  flex:1;
  background:var(--gold-bright);
  color:var(--black);
  box-shadow:0 8px 25px rgba(0,0,0,.5);
  position:relative;
}

.explore-btn::before{
  content:'';
  position:absolute;
  top:-5px;
  right:-5px;
  width:13px;
  height:13px;
  background:var(--gold);
  clip-path:
    polygon(
      50% 0,
      100% 38%,
      82% 100%,
      18% 100%,
      0 38%
    );
}

.surprise-btn{
  flex:0 0 145px;
  background:var(--black);
  color:var(--gold-bright);
  border:1px solid var(--gold);
  box-shadow:0 8px 25px rgba(0,0,0,.55);
}

/* =====================================================
   CATEGORY MENU
===================================================== */

.category-menu{
  position:fixed;
  left:50%;
  bottom:0;
  width:min(430px,100%);
  max-height:78vh;
  overflow-y:auto;
  background:var(--black);
  border-top:1px solid rgba(240,200,120,.5);
  box-shadow:0 -20px 50px rgba(0,0,0,.8);
  z-index:2400;
  transform:translate(-50%,110%);
  transition:
    transform .4s cubic-bezier(.22,.8,.25,1);
  padding:18px 18px 90px;
}

.category-menu.open{
  transform:translate(-50%,0);
}

/* MENU HEADER */

.menu-top{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  margin-bottom:18px;
}

.menu-eyebrow{
  font-family:'Bebas Neue',sans-serif;
  color:var(--gold-bright);
  font-size:12px;
  letter-spacing:2px;
}

.menu-title{
  font-family:'Bebas Neue',sans-serif;
  font-size:40px;
  line-height:.85;
  margin-top:3px;
}

.menu-close{
  width:32px;
  height:32px;
  border-radius:50%;
  border:1px solid rgba(200,155,90,.45);
  background:transparent;
  color:var(--gold-pale);
  font-size:20px;
  cursor:pointer;
}

/* CATEGORIES */

.category-section{
  margin-bottom:18px;
}

.category-heading{
  display:flex;
  align-items:center;
  gap:9px;
  padding:8px 0;
  border-bottom:1px solid rgba(200,155,90,.18);
  cursor:pointer;
}

.category-heading span{
  font-family:'Bebas Neue',sans-serif;
  color:var(--gold-bright);
  font-size:20px;
  letter-spacing:1px;
}

.category-count{
  color:var(--cream-dim);
  font-size:9px;
  letter-spacing:1px;
}

/* PLACE LIST */

.place-list{
  display:none;
  padding-top:7px;
}

.category-section.expanded .place-list{
  display:block;
}

.place-button{
  width:100%;
  display:flex;
  align-items:center;
  gap:10px;
  padding:10px 5px;
  border:none;
  border-bottom:1px solid rgba(244,237,228,.06);
  background:transparent;
  color:var(--cream);
  text-align:left;
  cursor:pointer;
}

.place-number{
  width:25px;
  font-family:'Bebas Neue',sans-serif;
  color:var(--gold-bright);
  font-size:12px;
}

.place-name{
  flex:1;
  font-size:12px;
  font-weight:500;
}

.place-arrow{
  color:var(--gold);
  font-size:15px;
}

.place-button:hover .place-name{
  color:var(--gold-bright);
}

/* =====================================================
   SURPRISE
===================================================== */

.surprise-flash{
  position:fixed;
  top:50%;
  left:50%;
  transform:
    translate(-50%,-50%)
    scale(.8);
  width:280px;
  padding:25px 20px;
  background:var(--black);
  border:1px solid var(--gold);
  box-shadow:0 20px 60px rgba(0,0,0,.8);
  text-align:center;
  opacity:0;
  pointer-events:none;
  z-index:2900;
  transition:
    opacity .25s ease,
    transform .25s ease;
}

.surprise-flash.show{
  opacity:1;
  transform:
    translate(-50%,-50%)
    scale(1);
}

.surprise-flash .small{
  font-family:'Bebas Neue',sans-serif;
  color:var(--gold-bright);
  letter-spacing:2px;
  font-size:12px;
}

.surprise-flash .big{
  font-family:'Bebas Neue',sans-serif;
  font-size:36px;
  line-height:.9;
  margin-top:6px;
}

/* =====================================================
   MOBILE
===================================================== */

@media(max-width:360px){

  .header h1{
    font-size:58px;
  }

  #map{
    height:500px;
  }

  .surprise-btn{
    flex-basis:125px;
  }

  .location-panel{
    min-height:175px;
    padding:11px;
    gap:11px;
  }

  .panel-image{
    width:105px;
    min-width:105px;
    height:150px;
  }

  .panel-info h2{
    font-size:27px;
  }

  .panel-info p{
    font-size:9.5px;
  }

  .details-title{
    font-size:37px;
  }

  .details-image{
    height:200px;
  }
}

</style>

</head>

/* =====================================================
   MAP
===================================================== */

const map = L.map('map',{
  zoomControl:true,
  attributionControl:true
});

map.setView(
  [19.0200,72.8500],
  11
);


/* =====================================================
   OPENSTREETMAP
===================================================== */

L.tileLayer(
  'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
  {
    maxZoom:19,
    attribution:'&copy; OpenStreetMap contributors'
  }
).addTo(map);


/* =====================================================
   MARKER ICON
===================================================== */

const markerIcon = L.divIcon({
  className:'',
  html:'<div class="gold-marker"></div>',
  iconSize:[30,30],
  iconAnchor:[15,15]
});


/* =====================================================
   MARKERS
===================================================== */

const markers=[];

locations.forEach(location=>{

  const marker=L.marker(
    [location.lat,location.lng],
    {icon:markerIcon}
  );

  marker.category=location.category;
  marker.locationData=location;

  marker.addTo(map);
  markers.push(marker);

  marker.on(
    'click',
    ()=>{
      showLocation(location);
    }
  );

});


/* =====================================================
   IMAGE LOADING
===================================================== */

function loadPanelImage(location){

  const image=document.getElementById('panelImage');

  image.onerror=function(){
    this.onerror=null;
    this.src=fallbackImage;
  };

  image.src=safeImage(location.image);
  image.alt=location.name;
}


/* =====================================================
   DETAIL IMAGE
===================================================== */

function loadDetailsImage(location){

  const image=document.getElementById('detailsImage');

  image.onerror=function(){
    this.onerror=null;
    this.src=fallbackImage;
  };

  image.src=safeImage(location.image);
  image.alt=location.name;
}


/* =====================================================
   SHOW LOCATION
===================================================== */

let currentLocation=null;

function showLocation(location){

  currentLocation=location;

  loadPanelImage(location);

  document.getElementById('panelNumber').textContent=
    String(location.id).padStart(2,'0');

  document.getElementById('panelCategory').textContent=
    location.category;

  document.getElementById('panelTitle').textContent=
    location.shortName || location.name;

  document.getElementById('panelDescription').textContent=
    location.description;

  document.getElementById('locationPanel').classList.add('show');

}


/* =====================================================
   BUILD DETAIL SECTION
===================================================== */

function addDetailSection(container,title,content){

  if(!content) return;

  const section=document.createElement('div');
  section.className='detail-section';

  const heading=document.createElement('div');
  heading.className='detail-heading';
  heading.textContent=title;

  section.appendChild(heading);

  if(Array.isArray(content)){

    if(content.length===0) return;

    const list=document.createElement('ul');
    list.className='detail-list';

    content.forEach(item=>{

      const li=document.createElement('li');
      li.textContent=item;

      list.appendChild(li);

    });

    section.appendChild(list);

  }

  else if(typeof content==='object'){

    Object.entries(content).forEach(([key,value])=>{

      const row=document.createElement('div');
      row.className='practical-item';

      const label=document.createElement('div');
      label.className='practical-label';

      label.textContent=
        key
          .replace(/_/g,' ')
          .replace(/\b\w/g,l=>l.toUpperCase());

      const val=document.createElement('div');
      val.className='practical-value';

      if(Array.isArray(value)){
        val.textContent=value.join(' / ');
      }
      else{
        val.textContent=value;
      }

      row.appendChild(label);
      row.appendChild(val);

      section.appendChild(row);

    });

  }

  else{

    const paragraph=document.createElement('p');
    paragraph.textContent=content;

    section.appendChild(paragraph);

  }

  container.appendChild(section);

}


/* =====================================================
   SHOW FULL DETAILS
===================================================== */

function showDetails(location){

  currentLocation=location;

  loadDetailsImage(location);

  document.getElementById('detailsNumber').textContent=
    String(location.id).padStart(2,'0');

  document.getElementById('detailsCategory').textContent=
    location.category;

  document.getElementById('detailsTitle').textContent=
    location.name;

  document.getElementById('detailsDescription').textContent=
    location.description;

  const container=
    document.getElementById('detailsSections');

  container.innerHTML='';

  addDetailSection(
    container,
    'HISTORY',
    location.history
  );

  addDetailSection(
    container,
    'WHY VISIT',
    location.why_visit
  );

  addDetailSection(
    container,
    'WHAT TO SEE / DO',
    location.what_to_see_or_do
  );

  addDetailSection(
    container,
    'PRACTICAL DETAILS',
    location.practical_details
  );

  addDetailSection(
    container,
    'LOCAL TIP',
    location.local_tip
  );

  addDetailSection(
    container,
    'VISITOR NOTES',
    location.visitor_notes
  );

  addDetailSection(
    container,
    'HISTORY NOTES',
    location.history_notes
  );

  addDetailSection(
    container,
    'ENGINEERING NOTES',
    location.engineering_notes
  );

  addDetailSection(
    container,
    'LOCAL LEGEND',
    location.local_legend
  );

  document
    .getElementById('detailsPanel')
    .classList.add('show');

}

/* =====================================================
   FILTERS
===================================================== */

const filterButtons=
document.querySelectorAll('.filter');

filterButtons.forEach(button=>{

  button.addEventListener(
    'click',
    ()=>{

      const category=
        button.dataset.category;

      filterButtons.forEach(btn=>{
        btn.classList.remove('active');
      });

      button.classList.add('active');

      markers.forEach(marker=>{

        if(category==='ALL'){

          marker.addTo(map);

        }

        else if(marker.category===category){

          marker.addTo(map);

        }

        else{

          map.removeLayer(marker);

        }

      });

    }
  );

});


/* =====================================================
   CATEGORY MENU
===================================================== */

const categoryContainer=
document.getElementById('categoryContainer');

const categories=[
  'RELIGIOUS',
  'HERITAGE',
  'SIGHTSEEING',
  'CULTURE',
  'ACTIVITIES'
];

categories.forEach(category=>{

  const categoryLocations=
    locations.filter(
      location=>location.category===category
    );

  const section=
    document.createElement('div');

  section.className=
    'category-section';

  section.innerHTML=`

    <div class="category-heading">

      <span>${category}</span>

      <span class="category-count">
        ${categoryLocations.length} STOPS
      </span>

    </div>

    <div class="place-list"></div>

  `;

  const placeList=
    section.querySelector('.place-list');


  categoryLocations.forEach(location=>{

    const button=
      document.createElement('button');

    button.className=
      'place-button';

    button.innerHTML=`

      <span class="place-number">
        ${String(location.id).padStart(2,'0')}
      </span>

      <span class="place-name">
        ${location.name}
      </span>

      <span class="place-arrow">
        →
      </span>

    `;


    button.addEventListener(
      'click',
      ()=>{

        document
          .getElementById('categoryMenu')
          .classList.remove('open');

        setTimeout(()=>{

          map.flyTo(
            [location.lat,location.lng],
            15,
            {
              animate:true,
              duration:1.2
            }
          );

          setTimeout(()=>{

            showLocation(location);

          },700);

        },250);

      }
    );


    placeList.appendChild(button);

  });


  section
    .querySelector('.category-heading')
    .addEventListener(
      'click',
      ()=>{
        section.classList.toggle('expanded');
      }
    );


  categoryContainer.appendChild(section);

});

   EXPLORE BUTTON
===================================================== */

document

  'click',
  ()=>{

    document
      .getElementById('categoryMenu')
      .classList.add('open');

  }

===================================================== */

document

      .getElementById('categoryMenu')
      .classList.remove('open');

  }

/* =====================================================
   SURPRISE ME
===================================================== */

document
.getElementById('surpriseButton')
.addEventListener(
  'click',
  ()=>{

    const randomLocation=
      locations[
        Math.floor(
          Math.random()*locations.length
        )
      ];


    document
      .getElementById('surpriseName')
      .textContent=
        randomLocation.name;


    const flash=
      document.getElementById('surpriseFlash');

    flash.classList.add('show');


    setTimeout(()=>{

      flash.classList.remove('show');

    },1100);


    setTimeout(()=>{

      map.flyTo(
        [
          randomLocation.lat,
          randomLocation.lng
        ],
        15,
        {
          animate:true,
          duration:1.4
        }
      );


      setTimeout(()=>{

        showLocation(randomLocation);

      },800);

    },500);

  }
);


/* =====================================================
   ESCAPE
===================================================== */

document.addEventListener(
  'keydown',
  event=>{

    if(event.key==='Escape'){

      document
        .getElementById('categoryMenu')
        .classList.remove('open');

      document
        .getElementById('locationPanel')
        .classList.remove('show');

      document
        .getElementById('detailsPanel')
        .classList.remove('show');

    }

  }
);

</script>
